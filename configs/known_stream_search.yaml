# Known-stream search of the galstreams streams, read by
# workflows.run_config.RunConfig.from_yaml and scripts/run_known_stream_search.py.
#
# Phase 2 stub: the keys below are proposals for review, commented out until
# RunConfig is written (phase 3). See the RunConfig docstring.
#
# search: known_stream
#
# distance_moduli: {start: 15.0, stop: 22.0, step: 0.1}   # plan, section 1
#
# # See analysis.cmd_match_filter.select_stars_in_match_filter
# match_filter:
#   name: des_gr
#   reference_band: [des_yr6, g]
#   color_bands: [[des_yr6, r]]
#
# # Default grid, for the streams without a known age or [Fe/H]. One set of
# # maps (and one video, one maps file) per isochrone. Default: the DES search
# # isochrone of Shipp et al. 2018; Z on the Marigo et al. 2017 scale.
# isochrones:
#   ages_gyr: [13.0]
#   metallicities: [0.0002]
#
# cuts: {}                     # see catalogs.catalog_cuts.get_cut_mask
#
# maps:
#   bin_size_deg: 0.1          # proposal: about a HEALPix pixel at nside 512
#   smoothing_deg: 0.3         # proposal: the default of star_density_healpix
#   footprint_nside: 512       # HEALPix footprint from the star counts
#
# streams: null                # null: every track crossing the footprint
#
# output_dir: figures/outputs/known_stream_search   # gitignored
# n_workers: 1
#
# No dust correction: the Euclid x DES magnitudes are already dereddened.
