# Generic stream search over the survey footprint, read by
# workflows.run_config.RunConfig.from_yaml.
#
# Only the values that change: the others are those of
# workflows.run_config.GENERIC_SEARCH_CONFIG (the defaults, in Python).
# Uncomment and edit what you need. Keys: those of GENERIC_SEARCH_CONFIG, and
# isochrone (one isochrone instead of the grid).
#
# No dust correction: the Euclid x DES magnitudes are already dereddened.

search: generic

# distance_moduli: {start: 15.0, stop: 22.0, step: 0.1}   # default: 15 to 22 every 0.1
#
# match_filter:                # default: Euclid VIS vs VIS - H
#   name: euclid_vis_h
#   reference_band: [euclid_q1, VIS]
#   color_bands: [[euclid_q1, H]]
#
# default_grid:                # one set of maps per isochrone
#   - {age: 13.0, metallicity: 0.0002}
#
# nside: 512
# mask_lmc: true               # mask the LMC, the SMC, the dwarf galaxies, the globular clusters (LVDB);
# mask_smc: true               # false: not masked
# mask_dwarfs: true
# mask_gc: true
# mask_radius_scale: {lmc: 6.5, smc: 11.0, dwarfs: 4.0, gc: 4.0}   # ellipse semi-major axis in half-light radii (or one value)
# smoothing_deg: 0.3
# polynomial_degree: 5         # fixed for now
# map_key: residual            # map of the Parquet file: residual, density or background
# known_tracks: true           # galstreams tracks on the residual gif
#
# output_dir: figures/outputs/generic_search   # gitignored
# n_workers: 8
