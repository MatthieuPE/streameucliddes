name: docs

on:
  pull_request:
    paths:
      - "src/streameucliddes/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "src/streameucliddes/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Installs the "docs" dependency group plus the package with its runtime
# dependencies, so autodoc can import every module. If those dependencies
# ever get heavy (torch, survey-data packages, ...), switch to the lean
# approach used in streamgoggles: install with `--no-deps` and list the
# expensive imports in `autodoc_mock_imports` in docs/source/conf.py.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        # Reads the version from .python-version.
        run: uv python install

      - name: Install dependencies
        run: |
          uv venv
          uv pip install --group docs -e .

      - name: Build docs
        run: .venv/bin/sphinx-build -b html docs/source docs/_build/html

      - name: Upload build artifact (PR preview)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
