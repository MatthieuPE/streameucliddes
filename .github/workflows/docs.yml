name: docs

on:
  pull_request:
    paths:
      - "src/streameucliddes/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "src/streameucliddes/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Deliberately lean install -- NOT `uv sync` (which pulls this project's
# full dependency graph; `hyrax` alone drags in mlflow/chromadb/onnxruntime
# and more just to get torch, several minutes even cached). A docs build
# only needs sphinx + its plugins, plus whichever streameucliddes modules'
# own imports autodoc actually needs to read their docstrings -- so this
# installs exactly that: the "docs" dependency group, and
# numpy/pandas/healpy/pyyaml (small, fast). `docs/source/conf.py`'s
# STREAMEUCLIDDES_DOCS_LEAN branch (set below) mocks the rest
# (torch/streamobs/ugali/gala/astropy/scipy/matplotlib/hyrax) instead of
# installing them -- both because they're the genuinely expensive/slow
# ones, and because streamobs/ugali need real external survey/isochrone
# data for anything beyond a bare import, which this workflow has no
# reason to set up just to read docstrings.
#
# Known gap from mocking rather than installing: a module whose signatures
# use a bare `torch.Tensor | None`-style annotation ends up with an empty
# API page in CI (Sphinx's mock objects have no `|` support). Describe such
# modules in the narrative pages too, or install the real package here.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        # Reads the version from .python-version.
        run: uv python install

      - name: Install dependencies
        run: |
          uv venv
          uv pip install --group docs numpy pandas healpy pyyaml
          uv pip install --no-deps -e .

      - name: Build docs
        env:
          STREAMEUCLIDDES_DOCS_LEAN: "1"
        run: .venv/bin/sphinx-build -b html docs/source docs/_build/html

      - name: Upload build artifact (PR preview)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
